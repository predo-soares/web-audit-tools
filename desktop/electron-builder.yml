appId: com.audit-screens
productName: Audit Web Tools
copyright: Copyright © 2026 Pedro Soares
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: audit-web-tools
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  identity: 'Pedro Soares (V658BJYP75)'
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Audit Web Tools needs access to your Documents folder to save exports and screenshots.
    - NSDownloadsFolderUsageDescription: Audit Web Tools needs access to your Downloads folder to save exports and screenshots.
  notarize: true
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: Pedro Soares
  category: Development
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
